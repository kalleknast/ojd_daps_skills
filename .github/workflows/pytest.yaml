name: Tests

on:
  push:
    branches: [dev, main, "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.10"}
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: macos-latest, python: "3.12"}
          - {os: windows-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU Torch on Linux and Windows
        if: runner.os != 'macOS'
        run: python -m pip install "torch>=2.6,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: Build and install the wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install dist/*.whl "pytest>=8,<9"
          python -m pip check
      - name: Test the installed wheel outside the source tree
        shell: bash
        run: |
          cp -r tests "$RUNNER_TEMP/ojd-tests"
          cd "$RUNNER_TEMP"
          python -m pytest ojd-tests -m "not integration" -q
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: distributions
          path: dist/*

  integration:
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 30
    env:
      OJD_DAPS_SKILLS_CACHE: ${{ github.workspace }}/.model-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .model-cache
          key: models-v1-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - name: Install
        run: |
          python -m pip install "torch>=2.6,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install . "pytest>=8,<9"
          python -m pip check
      - name: Run pretrained model tests
        run: python -m pytest -m integration -q
      - name: Verify cached models work offline
        env:
          HF_HUB_OFFLINE: "1"
        run: python -m pytest tests/test_live_models.py -q
