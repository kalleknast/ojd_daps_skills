[tool.poetry]
name = "ojd-daps-skills"
version = "3.1.0"
description = "Extract skills from job adverts and map them to skills taxonomies."
authors = ["Nesta <dataanalytics@nesta.org.uk>"]
maintainers = ["kalleknast"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/kalleknast/ojd_daps_skills"
packages = [{include = "ojd_daps_skills"}]
include = [
    {path = "ojd_daps_skills/data/*", format = ["sdist", "wheel"]},
    {path = "ojd_daps_skills/configs/*.yaml", format = ["sdist", "wheel"]},
]

[tool.poetry.dependencies]
# The published Nesta NER weights require spaCy 3.7 / NumPy 1.x.
python = ">=3.10,<3.13"
pydantic = ">=2.7.1,<3"
spacy = ">=3.7.4,<3.8"
# spaCy 3.7 uses the Click-based Typer API.
weasel = ">=0.3.4,<0.4"
typer = ">=0.9,<0.10"
click = ">=8.1,<8.2"
scikit-learn = ">=1.4.2,<1.5"
pandas = ">=2.2.2,<3"
pyyaml = ">=6,<7"
numpy = ">=1.26.4,<2"
huggingface-hub = ">=0.28,<1"
sentence-transformers = ">=3.4.1,<3.5"
transformers = ">=4.48,<4.50"
torch = ">=2.6,<3"
platformdirs = ">=4,<5"
joblib = ">=1.3,<2"
srsly = ">=2.4,<3"
wasabi = ">=1.1,<2"
toolz = ">=0.12,<2"
boto3 = {version = ">=1.34,<2", optional = true}

[tool.poetry.extras]
s3 = ["boto3"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<9"
ruff = ">=0.9"
build = ">=1,<2"

[tool.pytest.ini_options]
markers = ["integration: downloads and runs the pretrained NLP models"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["poetry-core>=1.9,<3"]
build-backend = "poetry.core.masonry.api"
