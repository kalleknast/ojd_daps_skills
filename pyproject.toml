[tool.poetry]
name = "ojd-daps-skills"
version = "3.2.0"
description = "Extract skills from job adverts and map them to skills taxonomies."
authors = ["Nesta <dataanalytics@nesta.org.uk>"]
maintainers = ["kalleknast"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/kalleknast/ojd_daps_skills"
packages = [{include = "ojd_daps_skills"}]
include = [
    {path = "ojd_daps_skills/data/*", format = ["sdist", "wheel"]},
    {path = "ojd_daps_skills/configs/*.yaml", format = ["sdist", "wheel"]},
]

[tool.poetry.dependencies]
# The 3.7-trained Nesta model was checked against spaCy 3.8.16 on 336 examples.
python = ">=3.10,<3.14"
pydantic = ">=2.7.1,<3"
spacy = ">=3.8.16,<3.9"
weasel = ">=1,<2"
typer = ">=0.27,<1"
click = ">=8.2.1,<9"
scikit-learn = ">=1.6,<1.7"
pandas = ">=2.2.3,<3"
pyyaml = ">=6,<7"
numpy = ">=2.1,<3"
huggingface-hub = ">=0.28,<1"
sentence-transformers = ">=3.4.1,<3.5"
transformers = ">=4.48,<4.50"
# Recent Windows Torch wheels fail to initialize c10.dll in the spaCy stack.
torch = [
    {version = ">=2.8,<2.9", markers = "sys_platform == 'win32'"},
    {version = ">=2.8,<3", markers = "sys_platform != 'win32'"},
]
platformdirs = ">=4,<5"
joblib = ">=1.3,<2"
srsly = ">=2.4,<3"
wasabi = ">=1.1,<2"
toolz = ">=0.12,<2"
boto3 = {version = ">=1.34,<2", optional = true}

[tool.poetry.extras]
s3 = ["boto3"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<9"
ruff = ">=0.9"
build = ">=1,<2"

[tool.pytest.ini_options]
markers = ["integration: downloads and runs the pretrained NLP models"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["poetry-core>=1.9,<3"]
build-backend = "poetry.core.masonry.api"
